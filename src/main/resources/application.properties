spring.application.name=personal-finance-manager
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JSON output: compact, plain BigDecimal, ISO dates
spring.jackson.serialization.indent-output=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.generator.write-bigdecimal-as-plain=true

# Session cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m
